# Protogrok ~300M configuration (verified: 305.8M parameters)
d_model: 1024
payload_dim: 512
header_dim: 384
packet_layers: 16
session_layers: 8
nhead: 16
mlp_ratio: 4
memory_slots: 8
dropout_rate: 0.1

proto_vocab: 132        # overridden at train time from the data
num_classes: 2          # anomaly finetune (use 20 for traffic-class)
dtype: float32          # set bfloat16 for mixed precision on GPU/TPU
param_dtype: float32
