name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Bin-packing report (synthetic smoke)
        run: |
          python - <<'PY'
          from optimization import PackingConfig, padding_report
          from tests.test_batching import _variable_length_examples
          r = padding_report(_variable_length_examples(500), PackingConfig(num_buckets=4))
          print("padding reduction:", r["padding_reduction"])
          assert r["padding_reduction"] > 0
          PY
